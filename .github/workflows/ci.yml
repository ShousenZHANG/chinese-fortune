name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 只在 PR 上取消在途运行。push 到 main 时连推两个 commit 会取消前一个的 CI,
  # 而发布 tag 恰恰打在这类 commit 上 —— 那次运行的结果就永远没有了。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        # Whole repo, not just scripts/ + tests/: evals/run_checks.py IS the
        # release gate and was never linted. pyproject already excludes
        # dist/ and _competitors/, so widening the scope is free.
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy scripts/ --ignore-missing-imports --disallow-untyped-defs

      - name: Tests + coverage gate (subprocess-tracked, fail under 80%)
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        # pytest-cov auto-combines the parallel subprocess data and applies
        # fail_under (from [tool.coverage.report]); no manual combine needed.
        run: python -m pytest tests/ -q --cov=scripts --cov-report=term-missing

      - name: Release harness (evals/run_checks.py)
        run: python -X utf8 evals/run_checks.py

      - name: Build importable skill package
        run: python scripts/build_skill.py

      - name: Upload package artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: chinese-fortune-skill
          path: dist/*.zip
          if-no-files-found: error
