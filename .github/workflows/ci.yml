name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use the pinned Python tzdata package on Linux as well as Windows.
  PYTHONTZPATH: ""

concurrency:
  group: ci-${{ github.ref }}
  # 只在 PR 上取消在途运行。push 到 main 时连推两个 commit 会取消前一个的 CI,
  # 而发布 tag 恰恰打在这类 commit 上 —— 那次运行的结果就永远没有了。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy scripts/ --ignore-missing-imports --disallow-untyped-defs

      - name: Full tests and combined coverage gate
        # No marker exclusion in CI. The local quick selection is not a release gate.
        run: python -m pytest tests/ -q --cov --cov-report=term-missing --cov-report=json

      - name: Coverage groups (same collected data; combined threshold already enforced)
        # Diagnostic reports do not replace or weaken the combined 80% gate.
        run: |
          python -m coverage report --include='scripts/*' --omit='scripts/build_skill.py,scripts/import_classics.py' --fail-under=0
          python -m coverage report --include='evals/*,scripts/build_skill.py,scripts/import_classics.py' --fail-under=0

      - name: Build fixed commit skill and source archives
        if: matrix.python == '3.12'
        run: python -X utf8 scripts/build_skill.py --commit "${{ github.sha }}"

      - name: Clean runtime installation and exact artifact smoke
        if: matrix.python == '3.12'
        run: |
          archive=$(find dist -maxdepth 1 -name '*.zip' ! -name '*-sources.zip' -print)
          python -X utf8 evals/package_smoke.py --archive "$archive" --expected-commit "${{ github.sha }}"

      - name: Bind artifact to successful CI run
        if: matrix.python == '3.12'
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          checksums = Path('dist/SHA256SUMS').read_text(encoding='utf-8')
          value = {'schema_version': '1.0', 'commit': os.environ['RELEASE_COMMIT'],
                   'ci_run_id': os.environ['RELEASE_RUN_ID'], 'ci_run_attempt': os.environ['RELEASE_RUN_ATTEMPT'],
                   'checksums': checksums, 'artifact_name': 'chinese-fortune-skill',
                   'require_workflow_conclusion': 'success'}
          Path('dist/CI-PROVENANCE.json').write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload package artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chinese-fortune-skill
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/CI-PROVENANCE.json
          if-no-files-found: error

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -c constraints-dev.txt
      - name: Installed package, UTF-8 and historical timezone tests
        run: python -X utf8 -m pytest tests/test_build.py tests/test_time_contract.py tests/test_request_time.py tests/test_reading_support.py tests/test_bazi_reading.py tests/test_classical_library.py -q
      - name: Clean runtime installation and extracted package smoke
        run: python -X utf8 evals/package_smoke.py
