name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use the pinned Python tzdata package on Linux as well as Windows.
  PYTHONTZPATH: ""

concurrency:
  group: ci-${{ github.ref }}
  # 只在 PR 上取消在途运行。push 到 main 时连推两个 commit 会取消前一个的 CI,
  # 而发布 tag 恰恰打在这类 commit 上 —— 那次运行的结果就永远没有了。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints-dev.txt

      - name: Lint (ruff)
        # Whole repo, not just scripts/ + tests/: evals/run_checks.py IS the
        # release gate and was never linted. pyproject already excludes
        # dist/ and _competitors/, so widening the scope is free.
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy scripts/ --ignore-missing-imports --disallow-untyped-defs

      - name: Tests + coverage gate (subprocess-tracked, fail under 80%)
        # coverage's subprocess patch tracks CLI processes; pytest-cov combines
        # the parallel subprocess data and applies
        # fail_under (from [tool.coverage.report]); no manual combine needed.
        #
        # 裸 `--cov` (不带值) 才会用 [tool.coverage.run] 的 source。写成
        # `--cov=scripts` 会**覆盖** config 的 source=["scripts","evals"] ——
        # 于是 9e2191d 那次「覆盖率含发布链路」的改动在 CI 里完全空转:
        # 分母 3303 vs 3595, 差 292 条 evals 语句, 而 fail_under=80 对
        # run_checks.py / mutate.py 这两个「决定发什么货」的文件零约束。
        run: python -m pytest tests/ -q --cov --cov-report=term-missing

      - name: Release harness (evals/run_checks.py)
        run: python -X utf8 evals/run_checks.py --checks-only

      - name: Build importable skill package
        run: python scripts/build_skill.py

      - name: Clean runtime installation and extracted package smoke
        if: matrix.python == '3.12'
        run: python -X utf8 evals/package_smoke.py

      - name: Upload package artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chinese-fortune-skill
          path: dist/*.zip
          if-no-files-found: error

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -c constraints-dev.txt
      - name: Installed package, UTF-8 and historical timezone tests
        run: python -X utf8 -m pytest tests/test_build.py tests/test_time_contract.py tests/test_request_time.py tests/test_reading_support.py tests/test_bazi_reading.py tests/test_classical_library.py -q
      - name: Clean runtime installation and extracted package smoke
        run: python -X utf8 evals/package_smoke.py
