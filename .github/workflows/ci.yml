name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit + integration tests (pytest)
        run: python -m pytest tests/ -q

      - name: Release harness (evals/run_checks.py)
        run: python -X utf8 evals/run_checks.py

      - name: Build importable skill package
        run: python scripts/build_skill.py

      - name: Upload package artifact
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: chinese-fortune-skill
          path: dist/*.zip
          if-no-files-found: error
