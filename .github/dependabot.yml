# main-only maintenance: version-update PR creation is paused.
# Actions use immutable commit SHAs; Python baselines use constraints files.
# Dependency upgrades are reviewed and validated before direct main updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
  - package-ecosystem: pip
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
