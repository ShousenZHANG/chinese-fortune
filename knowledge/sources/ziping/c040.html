<h1>四十、論偏官取運</h1>
<p>偏官取運，即以偏官所成之局，分而配之。</p>
<p>煞用食制，煞重食輕則助食，煞輕食重則助煞，煞食均而日主根輕則助身。忌正官之混雜，畏印綬之奪食。</p>
<p>煞用印綬，不利財鄉，傷官爲美，印綬身旺，俱爲福地。</p>
<p>煞用傷官，行運與食同。</p>
<p>七煞用財，其以財而去印存食者，不利劫財，傷食皆吉，喜財怕印，透煞亦順。其以財而助煞不及者，財已足則喜食印與幫身，財未足則喜財旺而露煞。</p>
<p>煞帶正官，不論去官留煞，去煞留官，身輕則喜助身，食輕則喜助食。莫去取清之物，無傷制煞之神。</p>
<p>煞無食制，而用刃當，煞輕刃重，則喜助煞；刃輕煞重，則宜制伏。無食可奪，印運何傷？七煞既純，雜官不利。</p>
