<h1>二十二、論外格用舍</h1>
<p>八字用神，既專主月令，何以而又有外格乎？外格者，蓋因月令無用，權而用之，故曰外格也。</p>
<p>如春木、冬水、土生四季之類，日與月同，難以作用，類象、屬象、沖財、會祿、刑合、遙迎、井欄、朝陽諸格，皆可用也。若月令自有用神，豈可別尋外格？</p>
<p>又或春木冬水，干頭已有財官七煞，而棄之以就外格，亦大謬矣。是故干頭有財，何用沖財？干頭有官，奚用合祿？書云：「提綱有用提綱重」，又曰：「有官莫尋格局」，不易之論也。</p>
<p>然所謂月令無用者，原是月令本無用神，而今人不知，往往以財被劫、官被傷之類，用神已破，皆以爲月令無用，而棄之以尋外格，則謬之又謬矣。</p>
