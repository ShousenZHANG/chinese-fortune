<h1>十一、論用神純雜</h1>
<p>用神既有變化，則變化之中，遂分純雜。純者吉，雜者凶。</p>
<p>何謂純？互用而兩相得者是也。如辛生寅月，甲丙並透，財與官相生，兩相得也；戊生申月，庚壬並透，財與食相生，兩相得也；癸生未月，乙己並透，煞與食相尅，相尅而得其當，亦兩相得也。如此之類，皆用神之純者也。</p>
<p>何謂雜？互用而兩不相謀者是也。如壬生未月，乙己並透，官與傷相尅，兩不相謀也；甲生辰月，戊壬並透，印與財相尅，亦兩不相謀也；癸生午月，丁己並透，財與煞相生，相生而適爲累，亦兩不相謀也。如此之類，皆用神之雜者也。</p>
<p>純雜之理，不出變化，分而疏之，其理愈明，學命者不可不知也。</p>
