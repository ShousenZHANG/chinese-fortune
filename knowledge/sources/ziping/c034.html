<h1>三十四、論財取運</h1>
<p>財格取運，即以財格所就之局，分而配之。</p>
<p>其財旺生官者，運喜身旺印緩，不利七煞傷官；若生官而復透印，傷官之地，不甚有害。至於生官而帶食破局，則運喜印綬，而逢煞反吉矣。</p>
<p>財用食生，財食重而身輕，則喜助身；財食輕而身重，則仍行財食，煞運不忌，官運反晦矣。</p>
<p>財格佩印，運喜官鄉；身弱逢之，最喜印旺。</p>
<p>財用食印，財輕則喜財食，身輕則喜比印，官運亦礙，煞反不忌也。</p>
<p>財帶傷官，財運則亨，煞運不利，運行官印，未見其美矣。</p>
<p>財帶七煞，不論合煞制煞，運喜食傷身旺之方。</p>
<p>財用煞印，印旺最宜，逢財必忌。傷食之方，亦順意矣。</p>
