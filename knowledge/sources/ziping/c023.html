<h1>二十三、論宮分用神配六親</h1>
<p>人有六親，配之八字，亦存於命。其由宮分配之者，則年月日時，自上而下；祖父妻子，亦自上而下。以地相配，適得其宜，不易之位也。</p>
<p>其由用神而配之者，則正印爲母，身所自出，取其生我也。若偏財受我尅制，何反爲父？偏財者，母之正夫也。正印爲母，則偏財爲父矣。正財爲妻，受我尅制，夫爲妻綱，則妻從夫。若官煞則尅制於我，何以反爲子女者？官煞者，財所生也。財爲妻妾，則官煞爲子女矣。至於比肩爲兄弟之類，則又理之顯然者也。</p>
<p>其間有無得力，或吉或凶，則以四柱所存，或年月或時日，財官傷刃，係是何物，然後以六親配之用神，局中作何喜忌，參而配之，可以了然矣。</p>
