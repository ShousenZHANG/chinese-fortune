<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-伤官带杀格">外十八格-伤官带杀格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 伤官带杀格</strong></p>
<p>且如甲乙日生，寅午戌地支全，若干头有庚辛，则藉庚辛为权。火制之为福，最要行旺运，忌见财，得中和为贵。</p>
<p>眉批：经云“伤官带杀，不跛则瞎”，故忌见之，终为贫夭，有制反贵。</p> </article>
