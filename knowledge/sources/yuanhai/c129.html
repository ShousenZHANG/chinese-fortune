<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-福德格">外十八格-福德格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 福德格</strong></p>
<p>此格只要己丑日主，地支巳酉丑全者是。忌火乡官乡，嫌冲破。福德非独己土，五阴皆有。</p>
<p>阴土己巳、己丑、己酉；</p>
<p>阴火丁巳、丁酉、丁丑；</p>
<p>阴水癸巳、癸丑、癸酉；</p>
<p>阴金辛巳、辛丑、辛酉；</p>
<p>阴木乙巳、乙丑、乙酉。</p>
<p>忌刑冲破害，岁运同。</p>
<p>眉批：阴土逢蛇金与牛，名为福德号貔貅，火来侵克非为美，名利空空一旦休。</p> </article>
