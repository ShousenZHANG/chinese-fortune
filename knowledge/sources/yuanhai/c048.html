<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论截路空亡">论截路空亡</h1>
<p><strong>论截路空亡</strong></p>
<p>甲己申酉最为愁，乙庚午未不须求，丙辛辰巳何劳问，丁壬寅卯一场空，</p>
<p>戊癸子丑君须记，人生值此也多忧，忽然更得胎中遇，白发盈盈苦未休。</p>
<p>以日取时见之方是，以年在日时论者非也。甲己日遁十二时中，有申酉二时上见壬癸为水，故甲己见申酉是也，余皆仿此。假如甲子日见申酉时乃为正犯，其余者见之非也。此空亡非但命中见之不美，以至百事，求财主官皆不利也。</p>
<p>眉批：截路者，如人在路途之中，遇水则不能前进，不可以济，故曰截路空亡。</p> </article>
