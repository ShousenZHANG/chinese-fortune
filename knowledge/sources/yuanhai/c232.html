<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="时上偏财诗诀">时上偏财诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>时上偏财诗诀</strong></p>
<p>时上偏财不用多，支干需要用搜罗，喜逢财旺兼身旺，冲破伤财受折磨。</p>
<p>时上偏财一位佳，不逢冲破享荣华，破财劫刃还无遇，富贵双全比石家。</p>
<p>时上偏财遇劫星，田园破尽苦还贫，伤妻损妾多遭辱，食不相资困在陈。</p>
<p>若是偏财带正官，劫星若露福难干，不宜劫运重来并，此处方知祸百端。</p> </article>
