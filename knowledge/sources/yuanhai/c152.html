<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="女命贵格">女命贵格</h1>
<p><strong>女命贵格</strong></p>
<p>正气官星，财官两旺，印绶天德，独杀有制，伤官生财，坐禄逢财，官星带合，</p>
<p>日贵逢财，官贵逢官，官星坐禄，官星桃花，食神生旺，食神生财，杀化印绶，</p>
<p>二德扶身，三奇合局，羊刃有制，拱禄拱贵，归禄逢财。</p>
<p>眉批：官星要合，只喜一位为贵，合多不贵反为下贱。</p> </article>
