<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="玄武当权诗诀">玄武当权诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>玄武当权诗诀</strong></p>
<p>玄武当权妙人神，日干壬癸坐财星，官星若也居门户，无破当为大用人。</p>
<p>壬癸名为玄武神，财官两见始成真，局无冲破当清贵，辅佐皇家一老臣。</p>
<p>眉批：以壬癸值寅午戌火局为财，辰戌丑未为官是也。正是壬寅、壬午、壬戌；癸巳、癸未、癸丑六者。</p> </article>
