<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论十二支相冲">论十二支相冲</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论十二支相冲</strong></p>
<p>子午相冲，</p>
<p>寅申相冲，</p>
<p>卯酉相冲，</p>
<p>辰戌相冲，</p>
<p>巳亥相冲，</p>
<p>丑未相冲。</p>
<p>(子宫癸水，午宫丁火，水能克火之故也。寅宫甲木，申宫庚金，因金克木之故也。以支中暗害为冲，余仿此。)</p>
<p>眉批：相冲者但得有逢合则不能冲。</p> </article>
