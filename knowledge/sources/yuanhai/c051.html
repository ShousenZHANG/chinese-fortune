<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论四废日">论四废日</h1>
<p><strong>论四废日</strong></p>
<p>春庚申(金囚死)，夏壬子(水囚死)，秋甲寅(木囚死)，冬丙午(火囚死)。</p>
<p>今人以春见庚辛，夏见壬癸，秋见甲乙，冬见丙丁为废者，皆非也。囚死，囚而无用谓之废。春乃木神用事，金囚而无用，故以庚金为废。夏用火而壬水为废。秋用金而甲木为废。冬用水而丙火为废。凡命中有遇之者，主作事无成，要分春夏秋冬四季看方准。</p> </article>
