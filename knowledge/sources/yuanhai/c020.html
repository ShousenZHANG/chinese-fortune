<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论起胎法">论起胎法</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论起胎法</strong></p>
<p>胎元，受胎之月也。子平有曰：先推胎息之位，次断变息之理，精命者不可不用此例也。</p>
<p>推法但从本生月前四位是也。其法如己巳月，则前午上是胎，却数退一位，於未上将生月天干己字，唤起己未，数至庚申，乃受胎之月也。其余皆仿此。</p> </article>
