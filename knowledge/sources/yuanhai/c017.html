<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="天干五阴通变">天干五阴通变</h1>
<p>**﻿天干五阴通变**</p>
<p>乙丁己辛癸 为比肩兄弟</p>
<p>丙戊庚壬甲 为伤官，小人。</p>
<p>丁己辛癸乙 为食神，天厨，寿星。</p>
<p>戊庚壬甲丙 为正财，正妻，克母。</p>
<p>己辛癸乙丁 为偏财，偏妻。</p>
<p>庚壬甲丙戊 为正官，禄马。</p>
<p>辛癸乙丁己 为偏官七杀。</p>
<p>壬甲丙戊庚 为印绶正人。</p>
<p>癸乙丁乙辛 为枭神，偏印，倒食，主克子。</p>
<p>甲丙戊庚壬 为败财逐马。</p> </article>
