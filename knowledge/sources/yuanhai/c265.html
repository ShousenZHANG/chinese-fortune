<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="带疾诗诀">带疾诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>带疾诗诀</strong></p>
<p>戊己生时气不全，伤官时月见留连，必当头面有亏损，脓血之灾苦少年。</p>
<p>日主加临戊己生，支辰火局气熏蒸，冲刑克破当残疾，发秃那堪眼不明。</p>
<p>丙丁日主丑行衰，七杀加临三合来，升合日求衣食缺，耳聋残疾面尘埃。</p>
<p>壬癸重重叠叠排，时辰若设见天财，纵然头面无斑癫，足见其人眼目灾。</p>
<p>丙丁火旺疾难防，四柱休囚辰巳方，水火相生来此地，哑中风疾喑中亡。</p>
<p>眉批：火气炎上若盛，伤其目。</p> </article>
