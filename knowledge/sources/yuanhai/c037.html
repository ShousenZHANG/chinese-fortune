<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论华盖">论华盖</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论华盖</strong></p>
<p>寅午戌见戌，巳酉丑见丑，申子辰见辰，亥卯未见未。</p>
<p>华盖本为吉，凡人命中得之，多主孤寡，纵贵亦不免为孤独也，遇之多为僧道术论。</p>
<p>《壶中子》云：华盖为艺术之星，主孤。</p>
<p>眉批：此星如盖立乎大帝之旁。</p> </article>
