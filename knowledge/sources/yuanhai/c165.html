<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="神趣八法-属象">神趣八法-属象</h1>
<p><strong>神趣八法-属象</strong></p>
<p>属象者，乃天干甲乙木，地之亥卯未全者是也。水火金土同。</p>
<p>又曰：属者，五行各属之意。即主干临何方位，乃东西南北之神也。如寅卯辰乃东方属木，巳午未南方属火，申酉戌西方属金，亥子丑北方属水，各专一方之气。如</p>
<p>壬子 壬子 癸丑 癸丑，二壬夺癸禄，乃僧道之命。</p>
<p>乙酉 甲申 乙酉 乙酉，乃都御史之命。</p> </article>
