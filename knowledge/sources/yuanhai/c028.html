<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论月德贵人">论月德贵人</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论月德贵人</strong></p>
<p>寅午戌月在丙；</p>
<p>申子辰月在壬；</p>
<p>亥卯未月在甲；</p>
<p>巳酉丑月在庚。</p>
<p>其法从寅起，丙甲壬庚，逐月顺数，周而复始，亦须在日上见之，更有福神助为吉。</p>
<p>眉批：</p>
<p>寅午戌丙为和，正、五、九月；</p>
<p>申子辰壬为和，三、七、十一月；</p>
<p>亥卯未甲为和，二、六、十月；</p>
<p>巳酉丑庚为和，四、八、十二月。</p> </article>
