<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-时上偏财格">内十八格-时上偏财格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 时上偏财格</strong></p>
<p>如时上偏财与时上偏官相似，只要时上一位，不要多。而三处不要再见财，却怕冲，与月上偏官一同。偏财要行财旺运。</p>
<p>高侍郎，</p>
<p>甲申 庚午 壬寅 壬寅(甲食神)</p>
<p>侯知府，</p>
<p>乙酉 乙卯 辛卯 辛卯</p>
<p>眉批：侯知府命中干支重见，兄弟分夺，只是财多财旺，原干辛弱不堪任之，所以分去却得中和。诗诀：月偏财是衆人财，最怕干支兄多来。身强财旺皆为福，若归官星足为灾。</p>
<p>时正财与正官同，不逢破害与相冲。柱中不见财官杀，时旺来寻此格中。</p> </article>
