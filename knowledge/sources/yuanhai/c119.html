<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-六壬趋艮格">外十八格-六壬趋艮格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 六壬趋艮格</strong></p>
<p>且如壬水日主，多见寅字，则用寅中甲木，暗邀己土为壬日之官星。丙火邀辛金为壬日印绶，怕午字、申字冲之，忌财官填实。喜身旺地，岁运同。</p>
<p>寅为艮土之方，故曰趋艮。谓壬禄在亥，寅与亥合，又谓之合禄，亦忌破害。运行申冲坏寅字，不吉。</p>
<p>眉批：</p>
<p>壬寅 壬寅 壬寅 壬寅，此趋艮之格</p> </article>
