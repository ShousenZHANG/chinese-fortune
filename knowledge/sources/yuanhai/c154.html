<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="滚浪桃花">滚浪桃花</h1>
<p><strong>滚浪桃花</strong></p>
<p>女命用官为夫，或杀只喜一位，多者克夫。如命满盘官星为忌，满柱杀星为福反吉。伤官不为贵，伤官运复行克夫，伤官有制身贵。女命伤官，刑子克夫，为妓女命。女命官星多者，伤夫主贱。伤官桃花，为妓女命，或主克子息。若见贵人一位，或带荣神，或犯绝地，多富贵贞节。禄马相随，桃花带贵，咸池遇马多淫，妨夫破家。有辰无戌命孤，晚景寂寞；戌多无辰，初年劳碌，中年好，不妨夫，不克子，风流而淫。辰戌全则淫乱破家，伤夫克子，夭寿残疾。</p>
<p>眉批：如伤官无制身绝，又犯桃花又逢水，定作滚浪之说。</p> </article>
