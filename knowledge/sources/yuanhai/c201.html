<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="弃命从杀论">弃命从杀论</h1>
<p><strong>渊海子平卷四</strong></p>
<p><strong>弃命从杀论</strong></p>
<p>甲乙无根 怕逢申酉 杀合逢此 双目定瞽</p>
<p>乙木酉月 见水为奇 有根丑绝 无根寅危</p>
<p>乙木坐酉 庚丁透出 遇库归根 孤神得失</p>
<p>丙火申提 无根从煞 有根南旺 脱根寿促</p>
<p>阳火无根 水乡必忌 阴火无根 水乡必救</p>
<p>阴火酉月 弃命就财 北行入格 南走为灾</p>
<p>戊己亥月 身弱为弃 卯月同推 嫌走劫比</p>
<p>庚金无根 寅宫火局 南方有贵 须防寿促</p>
<p>辛巳阴柔 水囚官杀 运限加金 聪明发达</p>
<p>壬日戌提 癸干未月 运喜东方 逢冲则绝</p>
<p>弃命就财 须要会财 弃命从杀 须要会杀</p>
<p>从财忌杀 从杀喜财 会逢根气 命损无猜</p>
<p>眉批：“甲乙无根”，无根，言休囚欲绝。</p> </article>
