<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论起变法">论起变法</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论起变法</strong></p>
<p>取时上天干合处，时下地支合处。</p>
<p>假如丙寅时，取天干丙与辛合，地支寅与亥合，即辛亥是也。如柱中天干无辛字，地支无亥字，乃只虚邀为是，不必拘泥。</p>
<p>眉批：此等法例，时师罕见，不知此义，安能与士大夫谈命哉。</p> </article>
