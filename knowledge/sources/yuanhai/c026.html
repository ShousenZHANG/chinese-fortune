<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论太极贵人">论太极贵人</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论太极贵人</strong></p>
<p>甲乙生人子午中，丙丁鸡兔定亨通，戊己两干临四季，庚辛寅亥禄盈丰，</p>
<p>壬癸巳申偏喜美，值此应当福气锺，更须贵格相扶合，侯封万户列三公。</p>
<p>其法以生年为主，取别干则非也。</p>
<p>眉批：太极者，乃初始也。物造于初为夫极者，乃成收也。物有归曰极，贵乎始终相保。</p> </article>
