<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="冠带诗诀">冠带诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>冠带诗诀</strong></p>
<p>命逢冠带少人知，初主贫寒中主宜，更得贵人加本位，功成名遂又何疑。</p>
<p>人命若还逢冠带，兄弟妻孥无陷害，因何接祖绍箕裘，只为胎中有冠盖。</p>
<p>眉批：冠带如人年长至十五，可以冠中，更带以在。五行始生，招之故为吉庆，人命当此，可以兴家立业。</p> </article>
