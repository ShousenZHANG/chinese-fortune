<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="曲直格诗诀">曲直格诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>曲直格诗诀</strong></p>
<p>甲乙生人寅卯辰，又名仁寿两堪许，亥卯未全嫌白帝，若逢坎地必荣身。</p>
<p>木从木类正为奇，秋令逢之事不宜，得此清高仁且寿，水源相会福元齐。</p>
<p>眉批：此命是木类旺之说，只从木论，忌金喜木。</p>
<p>李总兵，</p>
<p>甲寅 丁卯 乙未 丙子，无官杀，是以为贵。</p> </article>
