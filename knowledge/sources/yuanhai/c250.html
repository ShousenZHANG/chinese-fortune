<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="稼穑诗诀">稼穑诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>稼穑诗诀</strong></p>
<p>戊己生居四季中，辰戌丑未要全逢，喜逢财地嫌官杀，运到东方定有凶。</p>
<p>戊己重逢杂气天，土多只论土居全，财星待遇堪为福，官杀如临有祸缠。</p>
<p>眉批：稼穑，承稻之神，领土气，故栽培土与稼穑想连而成一家，人命逢此反为贵。</p>
<p>戊戌 己未 戊辰 癸丑，乃张真人之命。</p> </article>
