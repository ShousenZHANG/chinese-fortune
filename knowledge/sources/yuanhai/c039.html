<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论十干食禄">论十干食禄</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论十干食禄</strong></p>
<p>甲食丙，乙食丁，丙食戊，丁食己，戊食庚，己食辛，庚食壬，辛食癸，壬食甲，癸食乙。</p>
<p>歌曰：</p>
<p>时人欲识食神名，甲人食丙乙人丁，丙食戊兮丁食己，己食辛上戊食庚，</p>
<p>庚壬辛癸偏相喜，壬甲癸乙最光荣，若遇食神骑禄马，必居豪富立功名。</p>
<p>不食空亡羊刃杀，不食休囚并死绝。食生食旺食贵神，食印食财别优劣。</p>
<p>若能推究得其真，禄食天厨无休歇。</p>
<p>眉批：</p>
<p>食神者，我生之子也，如甲木生丙火为食神言之，旺者主人体肥能饮食。</p> </article>
