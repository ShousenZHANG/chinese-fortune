<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论起玉堂天乙贵人">论起玉堂天乙贵人</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论起玉堂天乙贵人</strong></p>
<p>甲戊兼牛羊，乙己鼠猴乡，丙丁猪鸡位，壬癸兔蛇藏，</p>
<p>庚辛逢马虎，此是贵人方，命中如遇此，定作紫薇郎。</p>
<p>十干临十支皆贵人所临之方，惟辰戌二宫贵人不临，殊不知辰戌乃魁罡恶曜之地，天乙不临，所以不为贵也。</p>
<p>眉批：言本乃主天之神而曰天乙，临之方有恶煞相浑，或落空亡之地，不为贵也。</p> </article>
