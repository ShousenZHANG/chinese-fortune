<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="正月建寅候诗诀">正月建寅候诗诀</h1>
<p><strong>渊海子平卷四</strong></p>
<p><strong>正月建寅候诗诀</strong></p>
<p>正月寅宫原是木，木生火旺土长生，戊兼午未宫中喜，申酉休囚数莫行。</p>
<p>眉批：正月甲木二十二日，艮土生三日，丁丙火生主五日，戊土寄生於寅</p>
<p>寅月重逢午戌亥，庚辛为主两推排，有根有土偏宜火，身弱休囚怕火来。</p>
<p>如用寅宫木火神，南方午未禄财欣，逆行戌亥还当旺，破损忧愁见酉申。</p>
<p>眉批：寅午戌为三合，以木火为用神，行南方大利</p>
<p>庚辛主弱逢寅月，午戍加临会杀星，日主无根还透土，逆行金水福兴隆。</p>
<p>眉批：金弱赖艮土以生，正谓“金逢艮而遇土，号曰还魂”</p>
<p>己戊身衰喜见寅，重重官杀必荣身，只求木火相生吉，运到西方怕酉申。</p>
<p>眉批：西方金旺，伤其官不利</p> </article>
