<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论起息法">论起息法</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论起息法</strong></p>
<p>取日主上天干合处，地支合处是也。</p>
<p>假如甲子日生人，天干年月时有己字，乃甲与己合。又取地支年月时有丑字，即己丑也。余皆仿此而推，此胎息之由。</p>
<p>眉批：如推贵命先从胎息之吉日，相生扶者贵，相克者贫</p> </article>
