<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-归禄格">内十八格-归禄格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 归禄格</strong></p>
<p>此格假令六甲日生人，得寅时为之归禄。盖甲禄在寅，余皆仿此。但四柱不合见官杀，见之则难归矣。喜行身旺运，兼行食神伤官财运，亦可发福，怕冲破。</p>
<p>王参政，</p>
<p>丙午 癸巳 甲子 丙寅</p>
<p>眉批：日禄归时格最良，怕官嫌杀喜身强，若见比肩分劫禄，刑冲破害更难当。</p> </article>
