<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-刑合格">内十八格-刑合格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 刑合格</strong></p>
<p>此格以六癸日生人为主，用戊土为正气官星，喜逢甲寅时，用寅刑巳中戊土，癸日得官星。如庚寅刑不成(整理者按：癸日不可能得庚寅时)，惟甲寅时是，行运与飞天禄马同。若四柱中有戊字、巳字则减分数。又怕庚寅伤甲字，刑巳字，忌申字，则减分数，岁君大运亦同。</p>
<p>节度使，</p>
<p>己未 辛未 癸亥 甲寅</p>
<p>陈侍郎，</p>
<p>甲戌 甲戌 癸酉 甲寅</p>
<p>诗诀：阴水寅时格正清，又愁庚克不能刑，运行若不逢蛇地，方得清高有利名。</p> </article>
