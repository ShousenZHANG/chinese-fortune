<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="临官诗诀">临官诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>临官诗诀</strong></p>
<p>临官帝旺最为奇，禄贵同宫仔细推，若不状元登上第，直须黄甲脱麻衣。</p>
<p>眉批：临官帝旺者，如人年至四十五十，居天下之广居，立天下之正位，行天下之大道，得志与民由之不得志，独行其道，不离此身也。</p> </article>
