<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-岁德扶财格">外十八格-岁德扶财格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 岁德扶财格</strong></p>
<p>且如甲日见戊己年是也。若财命有气，则主其人得继上物。身弱者虽有祖业，当托用而无运也。</p>
<p>眉批：凡身弱虽有祖业，不能任之，皆主花费不存，缘不及也。</p> </article>
