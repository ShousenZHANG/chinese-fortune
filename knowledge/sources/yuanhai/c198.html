<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="子平百章歌">子平百章歌</h1>
<p><strong>子平百章歌</strong></p>
<p>魁星岁驾五经首，甲旺提纲榜眼清。火明木秀绶魁日，金白水清甲第新。</p>
<p>重叠土金登紫阁，调和木火贯黄金。木生春令逢食伤，甲宿文伤义理深。</p>
<p>财印两轻官杀足，甲第连科一举成，根苗天乙俱榜眼，为魁木火定详英。</p>
<p>相涵金水亲黄榜，递互丙丁待紫宸，金水秋气炎方取，魁星官杀贵分明。</p>
<p>杀重身轻休道弱，如逢印绶作魁星，虽知识此分高下，熟记何须问子平。</p> </article>
