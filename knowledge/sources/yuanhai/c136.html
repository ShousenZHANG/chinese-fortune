<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-夹丘格拱财格">外十八格-夹丘格(拱财格)</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 夹丘格(拱财格)</strong></p>
<p>此格用日支与时支共拱其财。且如甲寅日、甲子时，虚拱丑宫己土为财库。又如丁卯日、丁巳时；甲午日、壬申时；癸酉日、癸亥时是也。要虚拱，不要填实及有牵绊，则拱不得。更要日主自旺或财旺运亦吉。</p>
<p>金丞相，</p>
<p>庚戌 戊子 癸酉 癸亥，以酉亥夹戌火为财。</p>
<p>张尚书，</p>
<p>丙辰 辛卯 癸酉 癸亥，酉亥夹拱戌火为财。</p>
<p>甲子 癸酉 癸酉 癸亥，同上</p>
<p>歌曰：夹丘之格少人知，拱夹休填塞库中。不犯柱中官杀位，一生清贵显当时。</p>
<p>眉批：金丞相命非夹丘，因年支戌字填实不吉。</p> </article>
