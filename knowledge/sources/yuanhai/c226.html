<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="日贵诗诀">日贵诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>日贵诗诀</strong></p>
<p>日贵支干一位同，空亡大忌带官冲，仁慈广德多姿色，会合财星空自崇。</p>
<p>丁日猪鸡癸兔蛇，刑冲破害谩咨嗟，临绝会合方成贵，终始分之乃是佳。</p>
<p>癸丁蛇卯届猪鸡，官被刑冲祸必随，纯粹施为有仁德，尊崇富贵出希奇。</p>
<p>日贵看来是兔蛇，格生亥酉越堪夸，刑冲不遇空亡位，辅佐功勳在帝家。</p>
<p>眉批：天乙贵人本四日，</p>
<p>癸卯 癸巳 丁酉 丁亥是也，癸卯、癸巳为壬癸兔蛇藏，丁酉、丁亥乃丙丁猪鸡位，贵人就在日支，所以取贵。只忌刑冲破害则伤贵人。</p> </article>
