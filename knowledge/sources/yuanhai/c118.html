<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-杂气印绶格">内十八格-杂气印绶格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 杂气印绶格</strong></p>
<p>干头透出格为真，只问财多何尊贵？辰戌丑未也，亦忌财，紧要行官运。</p>
<p>吕丞相，</p>
<p>丙寅 辛丑 癸巳 癸亥</p>
<p>葛侍诏，</p>
<p>庚寅 丙戌 戊子 癸丑</p>
<p>解云：葛侍诏系卖帽梳儿，此命是杂气之中，月令透出丙丁火，乃为印绶，只是还因日时上癸水为有财，行亥子财运，於壬辰运六年而不遂意，第七年岁在戊子年，二月二十八日壬寅日不禄，乃是贪财土也。不可不仔细推之、记之，以为违者鉴。</p>
<p>眉批：此统言之，亦忌财运。</p> </article>
