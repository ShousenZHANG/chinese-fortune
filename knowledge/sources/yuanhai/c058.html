<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论节候歌">论节候歌</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论节候歌</strong></p>
<p>正月立春雨水节，二月惊蛰及春分，三月清明并谷雨，四月立夏小满方，</p>
<p>五月芒种并夏至，六月小暑大暑当，七月立秋还处暑，八月白露秋分忙，</p>
<p>九月寒露又霜降，十月立冬小雪张，子月大雪冬至节，丑月小寒大寒昌。</p>
<p>眉批：此以立春日为始，或正月一二三四五六，立春又不问内增二日，只以节义为始，且立春为节，雨水为候，又为节气，逐月仿此。</p> </article>
