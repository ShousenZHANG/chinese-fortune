<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论十恶大败">论十恶大败</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论十恶大败</strong></p>
<p>甲辰乙巳与壬申，丙申丁亥及庚辰，戊戌癸亥加辛巳，乙丑都来十位神。</p>
<p>邦国用兵须大忌，龙蛇出穴也难伸，人命若还逢此日，仓库金银化作尘。</p>
<p>十恶者，凶也。大败者，怯敌也。谓六甲旬中，有十个日值禄入空亡，此十日谓之大败，故曰十恶大败。命中犯者，当以日主见之方是。其余见之，未可便作十恶论。若有吉神扶之稍吉。何以谓之禄入空亡？如甲辰、乙巳者，甲以寅为禄，乙以卯为禄，是甲辰禄以寅卯木为空，逢此为禄入空亡，是以败也。壬申者，壬以亥为禄，甲子旬以亥为空亡，是以败也。余皆仿此。</p>
<p>眉批：取日干上见之方是，四柱有吉神多，身旺若有，未可便作十恶论。</p> </article>
