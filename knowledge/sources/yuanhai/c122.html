<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-玄武当权格">外十八格-玄武当权格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 玄武当权格</strong></p>
<p>且如壬癸二日生，值寅午戌火局为财，辰戌丑未为官是也。正是壬寅、壬午、壬戌；癸巳、癸未、癸丑是也。忌冲破，身弱则不吉。壬癸属水，故为玄武。但得火局，故曰当权，无非水火既济之理而已矣，夫何异哉。得斯道者，主人性格温和，有智慧，有礼貌，面带赤黑，威而不猛。遇刑冲或岁运见之，则不利矣。</p>
<p>李都督，</p>
<p>庚戌 壬午 壬寅 辛亥</p>
<p>诗曰：壬癸名为玄武神，财官两见始成真，局无冲破当清贵，辅佐皇家一老臣。</p> </article>
