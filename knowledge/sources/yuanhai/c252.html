<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="炎上格诗诀">炎上格诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>炎上格诗诀</strong></p>
<p>夏火炎天焰焰高，局中无水是英豪，运行本地方成器，一举峥嵘夺锦饱。</p>
<p>火多炎上去冲天，玄武无侵富贵全，一路东方行好运，簪缨头顶带腰悬。</p>
<p>眉批：丙丁火全巳午未一类，如张太保，</p>
<p>乙未 辛巳 丙午 甲午，极贵之命，忌金水，喜东南要身旺怕冲。</p> </article>
