<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="二至阴阳相生理">二至阴阳相生理</h1>
<p><strong>二至阴阳相生理</strong></p>
<p>一年之内细分五行，配合气候於十二个月之中，各主旺相，以定用神。其中五行又分阴阳两股，於之生年之中各主生旺之气。用冬至一阳则有木先生旺之理。则试以甲、乙日生人，在冬至前，阳气未动，木方死绝，其木不甚吉利。若甲、乙日生人，在冬至之後，阳气已生，木乘暖气其命寿禄皆全，只要甲用神入格。又如丙丁日干生人，在冬至之前，遇水即灭，若在冬至之後，不甚忌水劫丙丁，乘木之生也。夏至阴生，则有金生水用之理。夏至之後，为三伏後而阴生，庚辛生於夏至之後，金有气不甚忌火，其理尤明，学者不可不知也。</p>
<p>眉批：冬至後阳生，夏至後阴生，五行各得其气，不为身弱，作中和而论。</p> </article>
