<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="起天官贵人">起天官贵人</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>起天官贵人</strong></p>
<p>天官遁甲火羊群，乙诲青龙事可陈，丙见巳兮为官贵，丁见酉兮戊戌寻，</p>
<p>己用卯兮庚宜亥，辛喜申兮壬爱寅，六癸之人逢见午，必作朝廷显代人。</p>
<p>其法以生年干论。甲申年生见未是，若时上见极佳。</p>
<p>眉批：天官要天元庸秀，无伤纳音和而福助，乃为吉。喜福神者，财官印也。逢恶杀不吉。</p> </article>
