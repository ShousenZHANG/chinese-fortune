interface:
  display_name: "Chinese Fortune"
  short_description: "八字排盘、古籍检索与白话解读；其他术数按需使用。"
  default_prompt: >-
    Use $chinese-fortune。每次先用 request_time.py 取得用户当前所在地时间，同请求各工具复用该时刻。
    出生时间、当前时间、明确目标时间分别处理。用 bazi_reading.py 提取盘面事实，
    用 classical_search.py 检索固定版本原文，读 references/22-output-contract.md 后解读。
    凡古籍无据者不妄断。以《子平真诠》月令格局为主，《滴天髓》《穷通宝鉴》分层对照，
    《三命通会》《渊海子平》补充对应条款。正文、注文、项目归纳分开，逐项核对条件与例外。
    先用自然白话回答，最多三条主判断；术语随文解释，古文短引附出处。保留关键条件与否定，
    不把工程评分、生肖分数或候选当个人结论。核对真实正文，保留更正，不把已知经历计为预测。
