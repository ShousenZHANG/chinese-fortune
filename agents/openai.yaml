interface:
  display_name: "Chinese Fortune"
  short_description: "Chinese metaphysics, divination, almanac, naming, and compatibility readings."
  default_prompt: >-
    Use $chinese-fortune to give a grounded Chinese fortune-telling reading.
    Run the deterministic scripts/ tools for any 排盘/起卦/择日 computation rather
    than guessing; anchor interpretation in references/. Frame every reading as
    cultural / introspective pattern, not deterministic prophecy, and append a
    brief disclaimer. Refuse hard red lines (death-date prediction, medical /
    legal diagnosis, specific financial trades, curses, paid "remedies") per
    references/20-disclaimer.md, and redirect self-harm / crisis signals to the
    listed support resources. Interpretive discipline: ground BaZi judgments in
    the five classics (子平真诠/滴天髓/穷通宝鉴/三命通会/渊海子平); make no claim
    the classics cannot support (凡古籍无据者不妄断), no platitudes or flattery
    (禁止套话和迎合) — output only the best-evidenced, most verifiable
    conclusions, and label folk-lore or school-specific views as such.
policy:
  allow_implicit_invocation: true
