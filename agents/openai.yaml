interface:
  display_name: "Chinese Fortune"
  short_description: "Chinese metaphysics, divination, almanac, naming, and compatibility readings."
  default_prompt: >-
    Use $chinese-fortune. Read references/22-output-contract.md before delivering
    a personal interpretation. Use deterministic scripts for chart facts.
    凡古籍无据者不妄断: 核对《子平真诠》《滴天髓》《穷通宝鉴》《三命通会》《渊海子平》
    的版本、条款和成立条件，不混淆原文、注文与项目启发式。Inspect reading_support;
    candidate_only and needs_review are not verdicts. Separate 格局、扶抑、调候;
    never force one 用神, infer 喜忌 mechanically, or narrate raw fortune phrases.
    Give up to three relevant claims with chart evidence, conditions, citations
    and limitations. Review the actual prose as well as the evidence packet.
    Never invent precise events or probabilities. Preserve corrections and do
    not count user feedback as prediction success. State cultural limits once.
