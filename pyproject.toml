[tool.ruff]
line-length = 100
# The tools run on 3.9 (macOS Command Line Tools python3); see tests/test_zero_install.py.
target-version = "py39"
# lunar_python and tzdata are shipped as published (5.9.0); not ours to lint.
extend-exclude = ["dist", "_competitors", "scripts/lunar_python", "scripts/tzdata"]

[tool.ruff.lint]
# Pyflakes (F), pycodestyle errors (E), warnings (W), isort (I), bugbear (B),
# comprehensions (C4), pyupgrade (UP). Pragmatic for a script-heavy repo.
select = ["F", "E", "W", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line length handled by formatter, not enforced hard
    "B008",  # function call in default arg — argparse pattern is fine
    "UP015", # redundant open mode "r" — explicit is clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests insert scripts/ onto sys.path before importing

[tool.pytest.ini_options]
markers = [
    "slow: exhaustive calendar/real-chart grids; optional local quick exclusion, required in CI",
]

[tool.coverage.run]
# pytest-cov 7 delegates subprocess tracking to coverage's explicit patch.
patch = ["subprocess"]
parallel = true
# Keep runtime and retained evaluation/build tools in the combined denominator.
# Group reports describe the same run; they do not substitute for this gate.
source = ["scripts", "evals"]
omit = ["scripts/lunar_python/*", "scripts/tzdata/*"]
sigterm = true

[tool.coverage.report]
fail_under = 80
precision = 1

[tool.mypy]
# CONTRIBUTING 声明「必须类型注解」—— 此前只是约定, mypy 不开这个开关, 实测
# `mypy scripts/ --disallow-untyped-defs` 有 22 处违反, 分布在 8 个文件里。
# 现已全部补齐并把它变成门禁。lunar_python 无类型存根, 其对象一律标 Any。
disallow_untyped_defs = true
# The tools run on 3.9, but mypy 2.x checks 3.10 at the lowest: it still catches
# 3.11-only calls (datetime.UTC, NotRequired); the CI py3.9 job runs the rest for real.
python_version = "3.10"
exclude = ["^scripts/lunar_python/", "^scripts/tzdata/"]
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
# Shipped as published, untyped: callers see Any, exactly as before it was vendored.
module = ["lunar_python", "lunar_python.*", "tzdata", "tzdata.*"]
follow_imports = "skip"
