<h1>四十二、論傷官取運</h1>
<p>傷官取運，即以傷官所成之局，分而配之。</p>
<p>傷官用財，財旺身輕，則利印比；身强財淺，則喜財運，傷官亦宜。</p>
<p>傷官佩印，運行官煞爲宜，印運亦吉，傷食不礙，財地則凶。</p>
<p>傷官兼用財印，其財多而帶印者，運喜助印；印多而帶財者，運喜助財。</p>
<p>傷官而用煞印，印運最利，傷食亦亨，雜官非吉，逢財即危。</p>
<p>傷官帶煞，喜印忌財。然傷重煞輕，運喜印而財亦吉。惟七殺根重，則運喜傷食印綬，身旺亦吉，而逢財爲凶矣。</p>
<p>傷官用官，運喜財印，不利傷食。若局中官露而財印兩旺，則比劫傷官，未始非吉矣。</p>
