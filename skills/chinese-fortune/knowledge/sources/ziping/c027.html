<h1>二十七、論喜忌干支有別</h1>
<p>命中喜忌，雖干支俱有，而干主天，動而有爲；支主地，靜以待用。且干主一而支藏多，爲福爲禍，安得不殊？</p>
<p>故曰甲用酉官，逢庚辛則官煞雜，而申酉不作此例。申亦辛之旺地，辛坐申酉，如府官而又掌道印也。逢二辛則官犯重，而二酉不作此例。辛坐二酉，如一府官而攝二郡也。透丁則傷官，而逢午不作此例。丁動而午靜，且丁己並藏，焉知其不爲財也？</p>
<p>然亦有支而能作禍福者，何也？如甲用酉官，逢午本未能傷，而又遇寅遇戌，不隔二位，二者合而火動，亦能傷矣，即此反官觀。如甲生申月，午不制煞，會寅會戌，二者清局而火動，亦能制煞矣。然必會有動，是正與干有別也。即此一端，餘者可知。</p>
