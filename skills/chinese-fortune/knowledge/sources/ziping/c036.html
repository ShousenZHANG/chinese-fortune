<h1>三十六、論印取運</h1>
<p>印格取運，即以印格所成之局，分而配之。</p>
<p>其印綬用官者，官露印重，財運反吉，傷食之方，亦爲最利。</p>
<p>若用官而兼帶傷食，運喜官旺印綬之方，傷食爲害，逢煞不忌矣。</p>
<p>印綬而用傷食，財運反吉，傷食亦利，若行官運，反見其災，煞運則反能爲福矣。</p>
<p>印用七煞，運喜傷食，身旺之方，亦爲美地，一見財鄉，其凶立至。</p>
<p>若用煞而兼帶傷食，運喜身旺印綬之方，傷食亦美，逢官遇財，皆不吉也。</p>
<p>印綬遇財，運喜劫地，官印亦亨，財鄉則忌。</p>
<p>印格而官煞競透，運喜食神傷官，印旺身旺，行之亦利。若再透官煞，行財運，立見其災矣。</p>
<p>印用食傷，印輕者，亦不利見財也。</p>
