<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="从革诗诀">从革诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>从革诗诀</strong></p>
<p>秋月金局一类看，名为从革使相欢，如无炎帝来临害，定作当朝宰相官。</p>
<p>金居从格贵人钦，造化清高福禄真。四柱火来相混杂，空门艺术谩经纶。</p>
<p>眉批：天干地支纯金方用此格。</p>
<p>如</p>
<p>辛酉 戊戌 庚申 辛巳，乃杨太尉命，忌火喜土，岁运亦然。</p> </article>
