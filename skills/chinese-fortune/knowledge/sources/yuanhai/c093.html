<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论日德">论日德</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>论日德</strong></p>
<p>日德有五：甲寅、戊辰、丙辰、庚辰、壬戌日是也。</p>
<p>其福要多而忌刑冲，无破害，恶官星，憎财旺加临会合，怕空亡而忌魁罡，此数者乃格之大忌也。</p>
<p>大抵日德主人性格慈善。日德俱多福必丰厚，运行身旺，大是奇绝。若有财官加临，别寻他格，方能免非横之祸。若旺气已衰，运至魁罡，其死必矣。或未发福，运至魁罡，休囚即好，防生祸患。一脱於此，必能再发，终力微矣，不可不知也。</p>
<p>眉批：此格忌刑冲破害，有损福泽。</p> </article>
