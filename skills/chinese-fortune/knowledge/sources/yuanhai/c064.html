<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论截流年节气日时刻数要诀">论截流年节气日时刻数要诀</h1>
<p><strong>论截流年节气日时刻数要诀</strong></p>
<p>审详春日莫他求，时正刻真节自酬。五时二刻惊蛰是，十时四刻清明头；</p>
<p>立夏一日三时六，芒种一日九时收；二日二时二小暑，二日七时四亥秋。</p>
<p>白露三朝单六刻，寒露三朝六时周；立冬三朝十一二，大雪四四两双流；</p>
<p>小寒四时九时六，五日三时打春牛；节遇子时加一日，此为捷法记心头。</p> </article>
