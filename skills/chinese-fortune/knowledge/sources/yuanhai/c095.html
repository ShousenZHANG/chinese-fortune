<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论魁罡">论魁罡</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>论魁罡</strong></p>
<p>夫魁罡者有四：壬辰、庚戌、庚辰、戊戌日是也。</p>
<p>如日位加临者衆，必是福。运行身旺，发福百端；一见财官，祸患立至。</p>
<p>主人性格聪明，文章振发，临事有断，惟是好杀。若四柱有财及官或带刑杀，祸不可测。倘日独处，冲者太衆，必是小人，刑责不已，穷必彻骨。运临财官旺处，亦防奇祸。</p>
<p>眉批：大凡四柱日多同，贵气斯来在此中，日主独逢冲克重，财官显露祸无穷。</p> </article>
