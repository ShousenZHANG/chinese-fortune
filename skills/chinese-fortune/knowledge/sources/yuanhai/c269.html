<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="长生诗诀">长生诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>长生诗诀</strong></p>
<p>长生管取命长荣，时日重临主性灵，更得吉神相会遇，少年及第入王庭。</p>
<p>长生若也得相逢，生下须招祖业隆，父母妻儿无克陷，安然享福保初终。</p>
<p>此诀虽五星中有定决生死，子平四柱亦要定生旺死绝之由。</p>
<p>眉批：五行长逢之地，木生於亥，火生於寅，金生於巳，水生於申，如能遇之，则福。</p> </article>
