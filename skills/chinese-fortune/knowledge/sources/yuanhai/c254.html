<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="弃命从财诗诀">弃命从财诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>弃命从财诗诀</strong></p>
<p>日主无根财犯重，全凭时印旺身宫，逢生必主兴家业，破印纷纷总是空。</p>
<p>日干无气满盘财，弃命相从是福胎，运旺财官皆福贵，如芬相助反为灾。</p>
<p>眉批：如</p>
<p>庚申 己酉 丙申 己丑，以金为财，弃命从之，主富，其命以丙断之。</p> </article>
