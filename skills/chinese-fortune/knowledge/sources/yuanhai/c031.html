<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论天厨贵人">论天厨贵人</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论天厨贵人</strong></p>
<p>甲丙爱行双女游，乙丁狮子己金牛，戊坐阴阳庚鱼腹，二千石禄坐皇州，</p>
<p>癸用天蠍壬人马，辛到宝瓶禄自由，此是天厨注天禄，令人福慧两优游。</p>
<p>眉批：此以甲木生丙为命时，丙禄在巳，故乙巳为禄，如母食子也。</p> </article>
