<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="飘荡诗诀">飘荡诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>飘荡诗诀</strong></p>
<p>偏财偏位发他乡，慷慨风流性要强，别立家园三两处，因名因利自家亡。</p>
<p>偏财别立在他乡，宠妾妨妻更克伤，爱欲有情妻妾衆，更宜春酒野花香。</p>
<p>眉批：偏财，天官未出者去招他方之财，支中若无藏者虽招求而无财，不必以他乡有断之。财官甲辰善之，辰主静，女人利之。</p> </article>
