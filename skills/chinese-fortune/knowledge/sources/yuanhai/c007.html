<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论十二支六合">论十二支六合</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论十二支六合</strong></p>
<p>子与丑合土，</p>
<p>寅与亥合木，</p>
<p>卯与戌合火，</p>
<p>辰与酉合金，</p>
<p>巳与申合水，</p>
<p>午与未合火，</p>
<p>午太阳、未太阴也。</p> </article>
