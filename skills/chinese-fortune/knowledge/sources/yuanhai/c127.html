<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-曲直格">外十八格-曲直格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 曲直格</strong></p>
<p>一曰仁寿，二曰青龙。此格以甲乙日取地支寅卯辰或亥卯未木局。要不见庚辛之气，见庚辛即官杀，非此格也。只从木而论，故曰曲直。运喜东方，北方有水，木赖水生，故从其类，主人多仁，忌西方运。</p>
<p>李总兵，</p>
<p>甲寅 丁卯 乙未 丙子</p>
<p>眉批：甲乙生人寅卯辰，亥卯未全嫌白帝，但从木类正为奇，得此清高仁且寿。</p> </article>
