<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="魁罡诗诀">魁罡诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>魁罡诗诀</strong></p>
<p>魁罡四日最为先，叠叠相逢掌大权，庚戌庚辰怕官显，壬戌壬辰畏财连。</p>
<p>主人性格多聪慧，好杀之心断不偏，柱有刑冲兼破害，一贫彻骨受答鞭。</p>
<p>戊戌庚辰杀最强，壬辰庚戍号魁罡，日加重者方为福，身旺逢之贵异常，</p>
<p>如逢一位冲刑重，彻骨贫寒不可当。魁罡四柱日多同，贵气期来在此中，</p>
<p>日主独逢冲克重，财官显露祸无穷。</p> </article>
