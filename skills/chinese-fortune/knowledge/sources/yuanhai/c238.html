<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="丑遥巳格诗诀">丑遥巳格诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>丑遥巳格诗诀</strong></p>
<p>辛日癸日多逢丑，名为遥巳合官星，莫言不喜官星旺，谁信官来反有成。</p>
<p>辛丑癸丑二日子，丑能合巳巳藏官，丑日多见方为妙，不宜子字柱中间。</p>
<p>若逢申酉更为美，辛嫌巳午丙丁干，癸嫌戊己及巳午，此命必须仔细看。</p>
<p>辛癸二日逢遇丑，便是官星暗入宫，申酉喜来临一字，忌逢巳午子垣凶。</p>
<p>眉批：只用辛丑、癸丑二日是也。辛用丑遥巳中丙为官，癸用丑遥巳中戊土为官，忌子字合住丑字则不能遥也。如</p>
<p>癸丑 乙丑 辛丑 戊子。</p>
<p>辛丑 辛丑 辛丑 庚子，主大贵之命也。</p> </article>
