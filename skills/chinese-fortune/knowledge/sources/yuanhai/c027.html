<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论三奇贵人">论三奇贵人</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论三奇贵人</strong></p>
<p>天上三奇甲戊庚，地下三奇乙丙丁，人中三奇壬癸辛。</p>
<p>甲戊庚者，以甲为日，以戊为月，以庚为星，既有日月星，地支须得戌亥为天门，方得为奇。若无戌亥，须有日月星而无天门，则不为奇矣。而有天门，若无丑卯酉巳又不为奇。寅中有箕星好风，酉中有毕宿主雨，丑卯为风雷，则三光失明，奇不得时也。地下三奇，乙木为阴木之魁，丙火为阳火之君，丁火为阴火之精，此地有之为奇。须用乙，乙属坤土，若无则不吉。</p>
<p>眉批：</p>
<p>程思曰“三星要顺，倒乱者非，日为一腐三矣”。</p>
<p>《壶中子》曰“三奇倒乱，吕望为王头钓专”。</p> </article>
