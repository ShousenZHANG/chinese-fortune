<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-六乙鼠贵格">内十八格-六乙鼠贵格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 六乙鼠贵格</strong></p>
<p>此格以子暗合巳，巳动合申，庚禄居申，则用庚官，得引出庚金用事。喜於亥卯时为妙，忌日与寅，无冲害伤破子乙二字及无财官，即六乙日子时。原有官星论官，忌寅午戌冲，见庚申辛酉丑字，有一位元则减分数，岁君同。亦忌月通财官，六格不用，大运同。</p> </article>
