<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-印绶格">内十八格-印绶格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 印绶格</strong></p>
<p>此格大要生旺，忌死绝，要四柱中有官星为妙。月上印绶最紧，行官印运便发，见财运破印，反为贪财坏印，财运不利也，岁君亦然。</p>
<p>知府，</p>
<p>乙亥 戊子 甲寅 甲子</p>
<p>侍郎，</p>
<p>辛酉 丙申 壬寅 辛亥</p>
<p>眉批：有印无财方是福，喜逢官位怕临财，主人囊括文章秀，一举丹墀面帝来。</p>
<p>解说：墀：音同迟，宫殿前台阶上面的空地。</p> </article>
