<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论天德贵人">论天德贵人</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论天德贵人</strong></p>
<p>正丁二坤(申)中，三壬四辛同，五乾(亥)六甲上，七癸八寅同，九丙十归乙，子巽(巳)丑庚中。</p>
<p>其法以生月分见之，正月生人见丁，二月生人见申即是也。</p>
<p>眉批：贵人在年月，乃补及父母之荫，在日时补己之贵。</p> </article>
