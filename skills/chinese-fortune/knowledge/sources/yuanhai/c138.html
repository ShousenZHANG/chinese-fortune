<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-五行俱足格">外十八格-五行俱足格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 五行俱足格</strong></p>
<p>此格取年月日时胎，带金木水火土全者是也。甲子年金，戊辰月木，丁巳日土，丁未时水；乙酉年水，壬午月木，辛未日土，丙申时火。</p>
<p>此格亦不论官杀，只取五行为全，自有生生不绝之义，化化无穷之理，是亦罕有矣。</p> </article>
