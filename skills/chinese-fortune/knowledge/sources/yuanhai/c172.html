<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="神趣八法-总释">神趣八法-总释</h1>
<p><strong>神趣八法-总释</strong></p>
<p>荆山居士解云：若甲乙日干见地支寅卯辰全者为类，见亥卯未全者为属。乙日见巳酉丑或申酉戌之类为从。甲日见己、乙日见庚之类为化。类属要身旺，而从化要衰也。丙丁日四柱皆火，而时支得卯木，谓之木火相照。壬癸日四柱皆水，而时支得一金，为金水相照。壬生午月水无根，乃弃命与午中丁火合，此伏象也。</p>
<p>眉批：神趣八法云，看八字先明从化为本，化不成方论财官，财官无取方论格局，如人身行藏兴立，亦可自立，终身无败。从化成局则富贵。赋云，火虚有焰，金实无声，木盛多仁，得从得化，定显身名之故也。</p> </article>
