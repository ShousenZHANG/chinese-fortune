<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="十一月建子候诗诀">十一月建子候诗诀</h1>
<p><strong>渊海子平卷四</strong></p>
<p><strong>十一月建子候诗诀</strong></p>
<p>丙丁日主月逢子，支下存申时又辰，火土旺乡成富贵，再行金水祸难禁。</p>
<p>眉批：十一月壬吉，壬水七日，癸水二十三日。</p>
<p>子宫有水金乡旺，见主休囚忌破支，元有土离逢水贵，午来冲对寿元衰。</p>
<p>眉批：金生水得助，有土不怕水，忌午火。</p>
<p>庚金遇子多强吉，火土根嫌未必凶，运去元辰番作贵，再行午运福重重。</p>
<p>庚日逢寅午戌行，日通火局是提纲，如行金水番成富，火土重来福怎当。</p>
<p>眉批：言庚金得火局，金见火土为害。</p>
<p>水归冬旺乐无忧，透用财官富九州，顺逆不分还富贵，提纲刑克事休休。</p> </article>
