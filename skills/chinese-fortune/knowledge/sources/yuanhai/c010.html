<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论十二支相穿">论十二支相穿</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论十二支相穿</strong></p>
<p>子未相穿，</p>
<p>丑午相穿，</p>
<p>寅巳相穿，</p>
<p>卯辰相穿，</p>
<p>申亥相穿，</p>
<p>酉戌相穿。</p>
<p>眉批：相穿为害，犯此者损六亲，不作困蹇而论。</p> </article>
