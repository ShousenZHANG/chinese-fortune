<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="五月建午候诗诀">五月建午候诗诀</h1>
<p><strong>渊海子平卷四</strong></p>
<p><strong>五月建午候诗诀</strong></p>
<p>五月宫中火正荣，高低贵贱两分明，财官印用直生旺，化杀欣逢要水平。</p>
<p>眉批：五月丁火旺二十二日，丙火旺七日。</p>
<p>五月炎炎则论火，如逢水火自然兴，西方金木多防克，丑土周还怕子迎。</p>
<p>午宫怕子水来冲，用火逢冲数必凶，日主庚辛如会杀，运中逢此反成功。</p>
<p>眉批：言子宫相冲之救，午宫以丁火为用，忌子宫癸水来冲。</p>
<p>财官印绶如藏午，西方休临申子辰，木火土乡还富贵，休来水土更嫌金。</p> </article>
