<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-润下格">外十八格-润下格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 润下格</strong></p>
<p>且如壬癸日，要申子辰全或亥子丑全是也，忌辰戌丑未官乡，喜西方运，不宜东南，怕冲克，岁运同。润下者，天干地支浑是水，如湖海汪洋，望以无际，主人清秀量宏。倘遇土运，必主淹滞，若生於冬月者，又为奇特者也。</p>
<p>万宗人，</p>
<p>庚子 庚辰 壬申 辛亥</p>
<p>眉批：生临壬癸水局中，汪洋又会向流东，若然不遇堤防土，金紫荣身位至公。</p> </article>
