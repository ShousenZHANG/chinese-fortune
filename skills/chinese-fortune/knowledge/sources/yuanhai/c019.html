<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论日上起时例">论日上起时例</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论日上起时例</strong></p>
<p>甲己还加甲，乙庚丙作初，丙辛从戊起，丁壬庚子居，戊癸何方发？壬子是真途。</p>
<p>其法以甲己日从时上起甲子，至本人生时。余皆仿此。</p>
<p>眉批：以甲子日生日子起，如甲子日午时於子上起甲子，丑上起乙丑，寅上起丙寅，余仿此。</p> </article>
