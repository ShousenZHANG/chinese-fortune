<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论行小运法">论行小运法</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论行小运法</strong></p>
<p>凡小运不问阴阳二命，男一岁起丙寅，二岁丁卯顺行。</p>
<p>截法：十一丙子二十一丙戌，周而复始。</p>
<p>女一岁起壬申，二岁辛未逆行。</p>
<p>截法：一岁壬申，十一壬戌，二十一壬子，周而复始。</p>
<p>眉批：小运之法，男从丙寅方，取三阳之义，女从壬申，乃从三阴之喜。一年一岁，男顺女逆数，尽物甲从头又数。</p> </article>
