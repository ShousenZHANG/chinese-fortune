<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-稼穑格">外十八格-稼穑格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 稼穑格</strong></p>
<p>以戊己日生，值辰戌丑未是也。忌东方运及北方财运。此命辰戌丑未俱全，得水为财，又无木克，是以为福。此格喜行西南，惟忌东北。所谓稼穑者，俱从于土，支干重见则为土之一类，深有培养之功。主人多信，人品重厚丰肥，生财有道，斯为富贵人矣。</p>
<p>张真人，</p>
<p>戊戌 己未 戊辰 癸丑</p>
<p>眉批：戊己生居四季中，辰戌丑未要全逢，喜逢财地兼官杀，运到东方定有凶。</p> </article>
