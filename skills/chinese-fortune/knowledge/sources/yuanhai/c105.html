<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-乙巳鼠贵格">内十八格-乙巳鼠贵格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 乙巳鼠贵格</strong></p>
<p>此格如月内有官星则不用之，大怕午字冲之。丙子时，丙字为妙，谓之聚贵也。或曰：柱中有庚字、辛字，并申字、酉字、丑字内有庚辛金则减分数，岁君大运亦然。又曰：四柱中原无官星，方用此格。</p>
<p>袁判院，</p>
<p>甲寅 戊辰 乙亥 丙子，贵人</p>
<p>车御带，</p>
<p>戊子 癸亥 乙未 丙子，贵人</p>
<p>眉批：诗诀，阴木天干丙午时，乙巳要贵富为奇，无冲官杀方为美，年少声名达凤池。以日干为主，取贵在时。</p> </article>
