<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="衰病死诗诀">衰病死诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>衰病死诗诀</strong></p>
<p>纳音衰病死重逢，成败之中见吉凶，若得吉神来救助，变灾为福始亨通。</p>
<p>衰病两逢兼值死，世人至老无妻子，不惟衣食不丰隆，灾病绵绵终损己。</p>
<p>眉批：五行以此比人之至六七十，由老衰弱而又死命中遇此，主人孤苦之断。</p> </article>
