<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-从革格">外十八格-从革格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 从革格</strong></p>
<p>此格以庚辛日见巳酉丑金局全，或申酉戌全者是也。忌南方火运，喜庚辛旺运。见亥卯未者，为之金木间革也。忌冲刑库破，岁运同。此命得申酉戌全，月令戊土生金，得从其类，生在权卫之职。</p>
<p>眉批：秋月金居从头看，名为从革便相亲，外无炎帝来临害，定作当朝宰相官。</p> </article>
