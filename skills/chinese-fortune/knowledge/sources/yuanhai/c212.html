<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="十月建亥候诗诀">十月建亥候诗诀</h1>
<p><strong>十月建亥候诗诀</strong></p>
<p>水木生居亥月乾，财官印绶喜相连，用壬运旺西方去，用木须欣寅卯逢。</p>
<p>眉批：十月乾金三日，甲木六日，壬水旺二十一日。</p>
<p>丙日壬杀喜东南，来至东南发显官，大运愁逢金水地，再行西兑寿难完。</p>
<p>眉批：行东方运，能助丙之力，酉运伤丙之身。</p>
<p>财官印绶立乾宫，水木相生福禄通，阳水喜金嫌火土，运行最怕巳相冲。</p>
<p>眉批：乾宫，亥宫也，壬水生旺之地。</p>
<p>日主无根干土金，月通亥子土来侵，只宜印绶扶身旺，何怕提纲损用神。</p>
<p>眉批：此言庚日或戊日。</p> </article>
