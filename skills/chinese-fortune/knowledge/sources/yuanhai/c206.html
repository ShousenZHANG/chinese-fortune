<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="四月建巳候诗诀">四月建巳候诗诀</h1>
<p><strong>渊海子平卷四</strong></p>
<p><strong>四月建巳候诗诀</strong></p>
<p>甲乙如临四月天，水乡木旺振财源，北方火地多凶破，酉又相逢祸便言。</p>
<p>眉批：四月巳宫火旺二十二日，庚金生五日，戊土三日。</p>
<p>四月干头木土逢，水乡木旺禄还通，如行金水多成败，更怕提纲物对冲。</p>
<p>金水干头四月胎，土为印绶火为财，身强土厚宜金土，日主轻浮怕水来。</p>
<p>眉批：土为金之印，火为水之财。</p>
<p>壬日巳月多火土，无根无印怕财乡，须行申酉是名利，逆走东南寿不长。</p>
<p>眉批：壬日以火为财，以土为杀，行申酉方金助之。</p>
<p>四月金生火土旺，三般用神要分明，财官印绶藏宫内，运看高低仔细寻。</p>
<p>眉批：四月丙戊皆明，丁己互相乘旺，看时参而用之。</p> </article>
