<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="杀重有救诗诀">杀重有救诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>杀重有救诗诀</strong></p>
<p>丙临申位逢阳水，月逢戌土反长年，若有吉神来救助，方知安乐寿绵绵。</p>
<p>巳到双鱼夭可知，重逢乙木死无移，干头若有庚金助，恰似春花放旧枝。</p>
<p>丙临申位火无焰，阳水逢之命不坚，若得土来相救助，管教福寿得长年。</p>
<p>眉批：甲申日月有丙火，杀重靠丙制之，忌行壬运，行壬运必死。若以戊土克壬水，水不能克火，以土救之。</p> </article>
