<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="六月建未候诗诀">六月建未候诗诀</h1>
<p><strong>渊海子平卷四</strong></p>
<p><strong>六月建未候诗诀</strong></p>
<p>丙丁日坐未宫逢，金水虽凶未必凶，木库火乡应富贵，再行申酉祸灾重。</p>
<p>眉批：六月未宫，己土十八日，丁火七日，乙木五日。</p>
<p>未月支藏木火时，不逢顺逆格高低，南方行去东方旺，酉位休愁戌亥亏。</p> </article>
