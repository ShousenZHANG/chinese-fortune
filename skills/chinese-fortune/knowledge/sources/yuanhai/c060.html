<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="又论节气歌">又论节气歌</h1>
<p><strong>又论节气歌</strong></p>
<p>看命先须看日主，八字始能究奥理。假如子上十日壬，中旬下旬方是癸。</p>
<p>丑宫九日癸之余，除却三辛皆属己。寅宫戊丙各七朝，十六甲木方堪器。</p>
<p>卯宫阳木朝初旬，中下两旬阴木是。三月九朝仍是乙，三日癸库余戊奇。</p>
<p>初夏九日生庚金，十六丙火五戊时。午宫阳火属上旬，丁火十日九日己。</p>
<p>未宫九日丁火明，三朝是乙余是己。孟秋己七戊三朝，三壬十七庚金备。</p>
<p>酉宫还有十日庚，二十辛金属旺地。戌宫九日辛金盛，三丁十八戊土具。</p>
<p>亥宫七戊五日甲，余皆壬旺君须记。须知得一拟三分，此诀先贤与验秘。</p>
<p>眉批：子宫初一日生至初十日生，当取壬水，十一日生至三十日生方取癸水，余仿此。</p> </article>
