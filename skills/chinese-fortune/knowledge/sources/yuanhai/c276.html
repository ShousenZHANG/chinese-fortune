<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="胞胎诗诀">胞胎诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>胞胎诗诀</strong></p>
<p>绝中逢生少人知，却去当生命里推，反本还元直细辨，忽然迍否莫猜疑。</p>
<p>胎神一位难为绝，克陷妻奴家道劣，不惟朝暮走忙忙，羊食狼贪无以别。</p>
<p>眉批：胞胎者，其行如人受气於母亲腹中以至胎成而生。</p> </article>
