<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="刑冲诗诀">刑冲诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>刑冲诗诀</strong></p>
<p>比肩羊刃日时逢，若问年令父道凶，父母干支相会合，财星健旺寿如松。</p>
<p>克夫那堪妻又伤，堪居道院共僧房，闲身作保防连累，财破妻灾事几场。</p>
<p>眉批：克日下伤妾，时下克上，月支克，大抵克妻尽于羊刃，防财上见之。又财官食神死绝，财者，妻也，财死则妻死，</p> </article>
