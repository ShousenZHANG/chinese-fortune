<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-岁德扶杀格">外十八格-岁德扶杀格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 岁德扶杀格</strong></p>
<p>且如甲日见庚年是也。正如年为君位，日为臣位，臣导权。然又以年为祖，日为己身，七杀有制，则祖上曾有要职。</p>
<p>眉批：甲为东方岁，居一岁之首，故曰岁德，主有仁寿。</p> </article>
