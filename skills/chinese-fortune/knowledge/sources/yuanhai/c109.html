<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-丑遥巳格">内十八格-丑遥巳格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 丑遥巳格</strong></p>
<p>此格只有辛丑、癸丑二日，用丑字多遥巳中丙戊，辛癸日得官星，丑字多为妙，若四柱中有子字绊住，则丑不能去遥矣。要四柱中有申字并酉字，得一字为妙。如辛丑日四柱中有丙丁字并巳字、午字，则减分数，岁君大运同。癸丑日亦不要见戊字、己字、巳字、丁字。</p>
<p>章统制，</p>
<p>辛丑 辛丑 辛丑 庚寅，以丑遥巳中丙火为辛之官星。</p>
<p>叶侍郎，</p>
<p>乙丑 己丑 癸丑 乙卯，以丑遥巳中戊土为癸之官星。</p>
<p>诗诀：辛日癸日更逢丑，名为遥巳合官星，莫言不立官星旺，非信官来反作战。</p>
<p>眉批：此格若有亥字亦不得，有官星可也，谓巳亥相冲也。</p> </article>
