<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论年上起月例">论年上起月例</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论年上起月例</strong></p>
<p>甲己之年丙作首，乙庚之岁戊为头，丙辛之岁寻庚上，丁壬壬位顺行流，若言戊癸何方发，甲寅之上好追求。</p>
<p>其法假如甲己生，於月上起丙寅，以正月为丙寅、二月丁卯，一顺数去，至其所生之月止，一月一位顺行。</p> </article>
