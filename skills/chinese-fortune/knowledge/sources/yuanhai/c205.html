<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="三月建辰候诗诀">三月建辰候诗诀</h1>
<p><strong>渊海子平卷四</strong></p>
<p><strong>三月建辰候诗诀</strong></p>
<p>三月辰宫只论土，杀多金水化为祥，提纲若用财官印，金水相临命有伤。</p>
<p>眉批：三月水土墓库之宫，戊土十八日，癸水五日，乙木七日。</p>
<p>戊士无根日坐寅，重重水旺福源深，如行木火宫中吉，金水相逢祸必侵。</p>
<p>三月干头只用金，火生土厚福还真，身为壬癸多逢土，火旺提防祸必临。</p>
<p>眉批：用金者喜有土生，火旺则伤金。</p> </article>
