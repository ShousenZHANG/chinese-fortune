<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="七月建申候诗诀">七月建申候诗诀</h1>
<p><strong>渊海子平卷四</strong></p>
<p><strong>七月建申候诗诀</strong></p>
<p>印绶财官月建申，北方回喜福还真，火金生旺多清贵，大限行来最怕寅。</p>
<p>眉批：七月申宫，庚金旺二十二日，壬水生五日，戊土二日。</p>
<p>建禄庚辛旺在申，有官有印有财星，逆行辰巳荣财禄，北地须知富贵成。</p>
<p>眉批：庚金在申月旺，宜运行北地为吉。</p>
<p>壬癸生临七八月，火土多厚北方奇，无伤无破休行水，帝旺临官运不宜。</p>
<p>眉批：言壬水生申酉月即有根，至帝旺运太过。</p> </article>
