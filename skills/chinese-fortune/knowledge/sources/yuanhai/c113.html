<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-六阴朝阳格">内十八格-六阴朝阳格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 六阴朝阳格</strong></p>
<p>喜行西方，东南次之，最忌北方。此格以六辛日为主，用丙火为正官，喜逢戊土，戊来动丙，辛日得官星。子字则要一位，多则不冲。若四柱中有丙字、丁字、午字，则冲子不中，减分数，大运亦同。</p>
<p>知院，</p>
<p>戊辰 辛酉 戊子 丙辰</p>
<p>太尉，</p>
<p>戊辰 辛酉 辛丑 戊子</p>
<p>眉批：辛逢戊子最相宜，名利高登折高枝，四季秋生无亥子，荣华富贵正为奇。</p> </article>
