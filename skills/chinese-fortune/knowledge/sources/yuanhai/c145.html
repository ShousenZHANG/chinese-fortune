<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论母">论母</h1>
<p><strong>论母</strong></p>
<p>正印者，乃生我之身也。如甲日以癸为母，遇己丑本主克母。(癸为印，逢己丑未乃是土克水，故云克母)。见多主母嫁二夫。一戊失地(戊乃癸之夫)或被克，主母伤前夫。戊字受生或印临桃花沐浴，母有外情。如印长生，主母慈淑寿长，益夫和子。母如临羊刃杀地，或值墓绝，孤寡，主母不贤，或有残疾不睦。须以理推，无不验矣。</p>
<p>眉批：癸水生甲木，甲以癸为母。桃花即咸池煞，主淫。</p> </article>
