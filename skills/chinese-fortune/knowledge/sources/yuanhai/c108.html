<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-子遥巳格">内十八格-子遥巳格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 子遥巳格</strong></p>
<p>此格以二甲子，子中癸水遥合巳中戊土，巳中戊丙同宫，丙动来合酉中辛金，甲子日得辛金官星，则巳酉丑三合官禄；要行官旺乡运，忌四柱中有庚申七杀，辛字官星，并申酉丑字绊住，则子不能去遥矣。若有午字冲子，则减分数，岁君、大运亦然。</p>
<p>赵知府，</p>
<p>丙寅 壬辰 甲子 甲子</p>
<p>平常人，</p>
<p>己丑 甲戌 甲子 甲子</p>
<p>以子合丑绊位，不能遥合巳动丙合辛，无贵。</p>
<p>诗诀：</p>
<p>甲子生逢甲子时，子来遥合巳中戊，戊能动丙丙合酉，甲得辛官贵可知。</p>
<p>不喜庚申辛酉出，丑来相绊亦非宜，更无午字相冲害，运入官乡运必奇。</p> </article>
