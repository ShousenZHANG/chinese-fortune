<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-炎上格">外十八格-炎上格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 炎上格</strong></p>
<p>且如丙丁二日，见寅午戌全或巳午未全亦是。但忌水乡金地，喜行东方运，怕冲，要身旺，岁运同。炎上者，火之势急，又得火局，浑然成势。火为文明之象，值此者当为朱紫之贵，非寻常之命也。</p>
<p>张太保，</p>
<p>乙未 辛巳 丙午 甲午</p>
<p>眉批：火多炎上气冲天，只此无忧富贵全，一路东方行好运，金冠头顶带腰悬。</p> </article>
