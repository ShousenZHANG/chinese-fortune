<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="八月建酉候诗诀">八月建酉候诗诀</h1>
<p><strong>渊海子平卷四</strong></p>
<p><strong>八月建酉候诗诀</strong></p>
<p>甲乙无根八月逢，庚辛金旺不嫌凶，北方水运财星足，逆走南方得失中。</p>
<p>眉批：八月辛金二十三日，庚金七日。</p>
<p>酉月藏金乙日逢，北方亥子水重重，离明午未财权重，巳丑加临寿必终。</p>
<p>眉批：言乙木逢巳酉丑金局官杀太重，故云。</p>
<p>甲乙酉月多官杀，无根日主一生低，北逢顺走休临丑，逆走南方巳上亏。</p>
<p>丁生酉月天干癸，去杀方能可去财，有气保身存印绶，无情行到水中来。</p>
<p>眉批：言丁火生於酉月，以辛金为财，喜土忌木。</p>
<p>秋金酉丑重金旺，除非火炼有声明，东方行去盈财禄，西北来临福必倾。</p>
<p>眉批：金旺喜火喜财为之，西北又是金水，少利。</p> </article>
