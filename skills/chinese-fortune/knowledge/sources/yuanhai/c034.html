<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论十干禄">论十干禄</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论十干禄</strong></p>
<p>甲禄在寅，乙禄在卯，丙戊禄在巳，丁己禄在午，庚禄在申，辛禄在酉，壬禄在亥，癸禄在子。</p>
<p>夫禄者，以天干地支所旺之乡。如甲禄在寅，乃东方甲乙之地支，辰、寅、卯配之，余皆同此。辰戌丑未乃天罡恶杀，禄神不临也。凡人命带禄，或凶或吉，或贵或贱，何以论之？</p>
<p>《天乙妙旨》云：禄马贵人无准托，考究五行之善恶，天元羸弱未为灾，地气坚牢足欢乐。</p>
<p>《源髓歌》曰：禄马更有多般说，自衰自死兼败绝。若无吉煞加助时，定知破祖多浮劣。</p>
<p>眉批：可得爵禄也，官得势而亨通谓之禄。最喜生旺，最忌休囚，如有禄者必得羊刃以卫之方可言福。</p> </article>
