<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论时墓">论时墓</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>论时墓</strong></p>
<p>夫时墓之论，谓财官之墓时论之也。要刑冲破害以开啓钥，其人必难发于少年。</p>
<p>经曰：少年不发库中人。也怕有物以压之，如丁用辰为官库，别有戊辰之类制之，则辰不能为官矣，如此难作好命。必乃有物以破其戊，虽得之发福亦浅。</p>
<p>经曰：鬼入墓中，危难者甚，若独类而长，才亦如之。此是秘言，不可轻泄也。</p> </article>
