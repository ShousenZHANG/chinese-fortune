<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="女命贱格">女命贱格</h1>
<p><strong>女命贱格</strong></p>
<p>官杀混杂，官杀无制，杀星太重，伤官太重，贪财破印，比肩犯重，无官见合，</p>
<p>无印见杀，伤官七杀，带合桃花，八字刑冲，财多身弱，羊刃冲刑，金神带刃，</p>
<p>多官多合，倒插桃花，身旺无依，伤官见官，印绶遇劫。</p>
<p>眉批：倒插桃花，如用子畏生酉见之。主为娼妓。</p> </article>
