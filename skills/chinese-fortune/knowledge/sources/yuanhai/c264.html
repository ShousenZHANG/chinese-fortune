<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="运通诗诀">运通诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>运通诗诀</strong></p>
<p>三合财官得运时，绮罗香里会佳期。洋洋已达青云志，财禄婚姻喜气宜。</p>
<p>运遂时来事事宜，布衣有份上天梯。贵人轻着提携力，指日青云贵可期。</p>
<p>自是生来不受贫，官居华屋四时春。夏凉冬暖清高处，馐馔杯盘胜别人。</p>
<p>此运祥光事转新，一团和气蔼阳春。青云有信天书近，定是超群拨萃人。</p>
<p>甲寅乙卯非为刃，辛酉庚申理一同。合起人元财马旺，中年显达富家翁。</p>
<p>眉批：人生四柱中已有财官印，逢三合又遇吉神，岂不为福喜事并有如锦上添花，常人发福，士人登第。</p> </article>
