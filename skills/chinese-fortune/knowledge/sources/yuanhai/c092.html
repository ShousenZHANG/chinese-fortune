<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论日贵">论日贵</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>论日贵</strong></p>
<p>日贵者，又即甲午庚牛羊之类。只有四日，</p>
<p>丁酉 丁亥 癸巳 癸卯耳，最怕刑冲破害。经云：崇为宝也，命为贵也，所以贵人怕三刑六害也。</p>
<p>贵神要聚於日，运行怕空亡及运行太岁加会，不要魁罡。主人纯粹有仁德，有姿色，不傲物，或犯前刑则贫贱。刑冲太甚，贵人生怒，反成其祸，不可不察。日贵有时法异同，须分昼夜贵。日要日贵，夜要夜贵矣。</p>
<p>眉批：诀曰，日贵支干一位同，空亡大忌带刑冲，仁慈积德多姿色，会合财星空不空。法以丙丁猪鸡位、壬癸兔蛇藏为例。</p> </article>
