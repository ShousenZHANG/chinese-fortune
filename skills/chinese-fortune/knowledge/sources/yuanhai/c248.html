<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="润下诗诀">润下诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>润下诗诀</strong></p>
<p>天干壬癸喜冬生，更值申辰会局成，或是全归亥子丑，等闲平步上青云。</p>
<p>壬癸生临水局中，汪洋一会向流东，若然不遇堤防土，金紫荣身位至公。</p>
<p>眉批：如万宗人，</p>
<p>庚子 庚辰 壬申 辛亥，得申子辰合亥子水局，合此格，只忌官运。</p> </article>
