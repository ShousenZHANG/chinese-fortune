<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论天地转杀">论天地转杀</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论天地转杀</strong></p>
<p>春兔夏马天地转，秋鸡冬鼠便为殃。行人在路须忧死，造屋未成先架丧。</p>
<p>物极而反谓之转，旺连天干曰天转，旺连纳音曰地转，谓之天地转。如春木旺之时，见乙卯乃天连天，谓之天转。见辛卯乃旺连纳音，谓之地转。夏乃火旺，见丙午为天转，见戊午为地转。秋乃金旺，见辛酉为天转，见癸酉为地转。冬乃水旺之时，见壬子为天转，丙子为地转。地转取纳音为是，其日最忌，上官受职、出行商贾、造作、嫁娶，必主凶。命逢此日，必主夭折。</p>
<p>眉批：</p>
<p>春乙卯天转，夏丙午，秋辛酉，冬壬子；</p>
<p>春辛卯地转，夏戊午，秋癸酉，冬丙子。</p>
<p>经曰：韩信被伤，只因天地转杀。</p> </article>
