<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="运晦诗诀">运晦诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>运晦诗诀</strong></p>
<p>干事难成又费钱，提防凶事近流年。初心欲遂熊罴兆，中却反成饱事眠。</p>
<p>比肩岁运必争论，斗讼官司为别人。兄弟阴人财帛事，闭门还有是非临。</p>
<p>不作祯祥反作灾，外情牵惹是非来。匣中珠宝牢难取，求谋不成又破财。</p>
<p>到此难留隔宿钱，求之劳碌又熬煎。若还财聚主克妻，又是官灾口舌缠。</p>
<p>劫财羊刃两头居，外面光华内本虚。官杀两头俱不出，少年夭折漫嗟吁！</p> </article>
