<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论五行相生相克">论五行相生相克</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论五行相生相克</strong></p>
<p>论五行相生：金生水，水生木，木生火，火生土，土生金。</p>
<p>论五行相克：金克木，木克土，土克水，水克火，火克金。</p>
<p>生我者为父母，我生者为子孙，克我者为官鬼，我克者为妻财，比和者为兄弟。详五阳五阴通变图。</p>
<p>眉批：生我者为印，我生者为伤官食神，克我者为官鬼七煞，我克者为妻财，比和者为比肩。</p> </article>
