<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论十二支三合">论十二支三合</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论十二支三合</strong></p>
<p>申子辰水局，</p>
<p>亥卯未木局，</p>
<p>寅午戌火局，</p>
<p>巳酉丑金局，</p>
<p>辰戌丑未土局。</p>
<p>(凡看命以三合取用为局入格。)</p>
<p>眉批：合局者为贵，但得五行相顺。</p> </article>
