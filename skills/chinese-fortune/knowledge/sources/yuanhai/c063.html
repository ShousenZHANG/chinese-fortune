<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论未来月朔节气奥诀">论未来月朔节气奥诀</h1>
<p><strong>论未来月朔节气奥诀</strong></p>
<p>月朔原来自古有，前九将来对後九，大月五干连九支，小月四干八支偶。</p>
<p>六六之年仔细思，任君走尽风寒路，便作今年立春数，算来又本无差误。</p>
<p>四十七年前有闰，闰前二月是今逢，分毫不漏真消息，尽在先生掌诀中。</p>
<p>但观中气所在，闰前之月，中气在晦；闰後之月，中气在朔；无中气则谓之闰月。</p> </article>
