<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="内十八格-拱禄格">内十八格-拱禄格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>内十八格 - 拱禄格</strong></p>
<p>此格只有五日，忌填实，最怕冲了日时拱位，又怕四柱中有伤日干。遇杀皆拱不住，则减分数，岁君大运同。经云：“拱禄拱贵，填实则凶。”</p>
<p>刘知府，</p>
<p>癸卯 癸亥 戊辰 戊午(戊禄在巳，辰午之拱)</p>
<p>白衣人，</p>
<p>壬子 丁未 丁巳 丁未(丁禄在午，未巳拱，子冲)</p>
<p>详云：此格有五日，丁巳日见丁未，己未日见己巳，戊辰见戊午，癸丑见癸亥，癸亥见癸丑。(两半本身皆是我拱藏位，虚中好，只忌填实，更忌官星来克破。)</p>
<p>眉批：两绊本身非是我，拱藏一位虚中好，不宜填实见官星，更忌官星来克破。</p> </article>
