<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论驿马">论驿马</h1>
<p><strong>渊海子平卷一</strong></p>
<p><strong>论驿马</strong></p>
<p>申子辰马在寅，寅午戌马在申，巳酉丑马在亥，亥卯未马在巳。</p>
<p>其法以水生申，病寅木。水生木，木为水子，此乃病处见子来相接。如人病不能进，待子来接之，如驿马来接。余依此推。</p>
<p>眉批：</p>
<p>有马必要鞍，必要闸方好。</p>
<p>无鞍不能乘，无栏不能止，皆无用也。</p>
<p>马前为栏，马後为鞍。</p> </article>
