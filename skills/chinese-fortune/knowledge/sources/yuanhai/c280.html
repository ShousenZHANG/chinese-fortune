<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="论八字撮要法">论八字撮要法</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>论八字撮要法</strong></p>
<p>用之为官不可伤。</p>
<p>用之为财不可劫。</p>
<p>用之为印不可破。</p>
<p>用之为食不可夺。</p>
<p>用之为禄不可冲。</p>
<p>若有七杀须要制，制伏太过反为凶。</p>
<p>若用伤官须要静，此是子平万法宗。</p>
<p>伤官最怕为官运，伤官尤喜见财星。</p>
<p>印绶好杀嫌财旺，羊刃怕冲宜合迎。</p>
<p>比肩要逢七杀制。七杀喜见食神刑。</p>
<p>有禄怕见官星到。食神最喜偏财临。</p>
<p>此是子平撮要法，江湖术者仔细明。</p>
<p>又不用财星尽可劫。不用官星尽可伤。不用印绶尽可坏。不用食神尽可夺。</p> </article>
