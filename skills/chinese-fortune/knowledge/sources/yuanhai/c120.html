<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="外十八格-六甲趋干格">外十八格-六甲趋干格</h1>
<p><strong>渊海子平卷二</strong></p>
<p><strong>外十八格 - 六甲趋乾格</strong></p>
<p>乾为亥宫，六甲日生亥多者是，有官杀非此格。且如六甲日生，柱中要亥字多，乃为天门之位，北极之垣，甲木赖之以长。如人以甲日生亥字多者，自然富贵矣。忌巳冲之。此论甲禄在寅，寅与亥合，谓之合禄。忌见财星及寅巳二字，岁运亦同。</p>
<p>靳安佰，</p>
<p>癸亥 癸亥 甲子 乙丑</p>
<p>诗曰：甲日生人喜亥字，趋乾为格正相宜，财官岁运如无见，管取声名达凤池。</p> </article>
