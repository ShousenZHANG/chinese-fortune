<article class="prose max-w-none text-brand-gray-200 text-base leading-loose" id="article-content"> <h1 id="六壬趋艮诗诀">六壬趋艮诗诀</h1>
<p><strong>渊海子平卷五</strong></p>
<p><strong>六壬趋艮诗诀</strong></p>
<p>壬日寅时为贵格，此名趋艮福非常，大伯刑冲并克破，相逢岁运祸非常。</p>
<p>壬喜逢寅庚喜辰，云龙凤虎越精神，支头重见无冲战，定是清朝食禄人。</p>
<p>眉批：壬水日主，多见寅字，则用寅中甲木，暗邀己土为壬日之官星，己乃甲之妻也。</p> </article>
